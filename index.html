<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>株初心者向け ローソク足特訓</title>

<style>

body{
  margin:0;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
  color:#111827;
}

.app{
  max-width:1200px;
  margin:0 auto;
  padding:24px;
}

.card{
  background:#fff;
  border-radius:28px;
  padding:32px;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

.badge{
  display:inline-block;
  background:#dcfce7;
  color:#065f46;
  padding:8px 16px;
  border-radius:999px;
  font-weight:bold;
  margin-bottom:18px;
}

h1{
  font-size:52px;
  margin-bottom:18px;
}

.sub{
  color:#6b7280;
  font-size:20px;
  line-height:1.8;
}

/* =========================
   カード3列
========================= */

.next-step-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
  margin-top:40px;
}

.next-card{
  background:#fff;
  border-radius:28px;
  padding:38px 28px;
  text-align:center;
  text-decoration:none;
  color:#111827;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
  transition:0.2s;
  border:none;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}

.next-card:hover{
  transform:translateY(-6px);
  box-shadow:0 16px 36px rgba(0,0,0,0.12);
}

.next-icon{
  width:120px;
  height:120px;
  margin:0 auto 20px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:54px;
}

.matsui .next-icon{
  background:#dcfce7;
}

.note-card .next-icon{
  background:#fef3c7;
}

.training-card .next-icon{
  background:#fee2e2;
}

.card-label{
  display:inline-block;
  margin:0 auto 18px;
  padding:10px 22px;
  border-radius:999px;
  font-size:15px;
  font-weight:bold;
}

.green{
  background:#10b981;
  color:#fff;
}

.yellow{
  background:#facc15;
  color:#111827;
}

.red{
  background:#ef4444;
  color:#fff;
}

.next-card h3{
  font-size:32px;
  margin-bottom:18px;
}

.next-card p{
  color:#6b7280;
  line-height:1.8;
  font-size:18px;
  min-height:100px;
}

.next-button{
  margin-top:24px;
  padding:20px;
  border-radius:18px;
  font-weight:bold;
  font-size:24px;
}

.green-btn{
  background:#10b981;
  color:#fff;
}

.yellow-btn{
  background:#facc15;
  color:#111827;
}

.red-btn{
  background:#ef4444;
  color:#fff;
}

.mini{
  margin-top:30px;
  color:#6b7280;
  font-size:15px;
}

@media (max-width:900px){

  h1{
    font-size:34px;
  }

  .next-step-cards{
    grid-template-columns:1fr;
  }

}

</style>
</head>

</div>
